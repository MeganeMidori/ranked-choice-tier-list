services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tierlist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tierlist}
      POSTGRES_DB: ${POSTGRES_DB:-tierlist}
    ports:
      # 5433 on the host to avoid clashing with a locally installed Postgres
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
